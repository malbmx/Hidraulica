      <line x1="100" y1="355" x2="390" y2="355" stroke="#0b4f6c" stroke-width="28" marker-end="url(#arr)" /><ellipse cx="600" cy="355" rx="185" ry="210" fill="#dff4fb" stroke="#168aad" stroke-width="5"/><line x1="785" y1="355" x2="1080" y2="355" stroke="#0b4f6c" stroke-width="28" marker-end="url(#arr)" />
