<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:Arial,sans-serif;color:#173042;margin:0;padding:18px;background:#fff}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{width:100%;height:auto;border:1px solid #d9e2e8}output{font-weight:700;color:#0b4f6c}.note{font-size:.9rem;color:#5b6570}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><h1>Explorador de continuidad</h1><div class="grid"><div><label>Caudal Q (L/s) <input id="q" type="range" min="0.5" max="10" step="0.1" value="4.5"> <output id="qv"></output></label><label>Diámetro D1 (mm) <input id="d1" type="range" min="30" max="120" value="75"> <output id="d1v"></output></label><label>Diámetro D2 (mm) <input id="d2" type="range" min="20" max="100" value="40"> <output id="d2v"></output></label><p>V1 = <output id="v1"></output> m/s<br>V2 = <output id="v2"></output> m/s</p></div><svg viewBox="0 0 600 320" aria-label="Tubería con contracción"><path d="M40 100 H260 L340 145 H560 M40 220 H260 L340 175 H560" fill="none" stroke="#2878b5" stroke-width="12"/><path id="arr1" d="M80 160 H230" stroke="#2f7d32" stroke-width="7"/><path id="arr2" d="M365 160 H535" stroke="#2f7d32" stroke-width="7"/><text x="80" y="80">Sección 1</text><text x="420" y="135">Sección 2</text></svg></div><p class="note">Modelo didáctico: flujo permanente, agua incompresible y velocidad media.</p><script>const ids=['q','d1','d2'];function u(){let q=+document.querySelector('#q').value/1000,d1=+document.querySelector('#d1').value/1000,d2=+document.querySelector('#d2').value/1000;let v1=q/(Math.PI*d1*d1/4),v2=q/(Math.PI*d2*d2/4);qv.value=(q*1000).toFixed(1);d1v.value=(d1*1000).toFixed(0);d2v.value=(d2*1000).toFixed(0);document.querySelector('#v1').value=v1.toFixed(2);document.querySelector('#v2').value=v2.toFixed(2);arr1.setAttribute('stroke-width',Math.min(18,4+v1));arr2.setAttribute('stroke-width',Math.min(18,4+v2));}ids.forEach(x=>document.querySelector('#'+x).addEventListener('input',u));u();</script></html>
