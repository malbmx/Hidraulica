<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:Arial,sans-serif;color:#173042;margin:0;padding:18px;background:#fff}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{width:100%;height:auto;border:1px solid #d9e2e8}output{font-weight:700;color:#0b4f6c}.note{font-size:.9rem;color:#5b6570}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><h1>Explorador de cantidad de movimiento</h1><div class="grid"><div><label>Caudal Q (L/s) <input id="q" type="range" min="0.5" max="10" step="0.1" value="4"> <output id="qv"></output></label><label>Diámetro (mm) <input id="d" type="range" min="25" max="100" value="50"> <output id="dv"></output></label><label>Ángulo de salida (°) <input id="a" type="range" min="0" max="180" value="90"> <output id="av"></output></label><p>Fx sobre el fluido = <output id="fx"></output> N<br>Fy sobre el fluido = <output id="fy"></output> N<br>|F| = <output id="fm"></output> N</p></div><svg viewBox="0 0 600 320" aria-label="Codo con vectores"><path d="M70 230 H300 Q420 230 420 110" fill="none" stroke="#2878b5" stroke-width="35"/><line x1="90" y1="230" x2="260" y2="230" stroke="#2f7d32" stroke-width="7"/><line id="out" x1="420" y1="200" x2="420" y2="70" stroke="#2f7d32" stroke-width="7"/><line id="force" x1="300" y1="230" x2="210" y2="140" stroke="#e07a1f" stroke-width="7"/></svg></div><p class="note">Modelo didáctico sin fuerzas de presión ni peso. La fuerza del fluido sobre el codo tiene sentido opuesto.</p><script>function u(){let q=+document.querySelector('#q').value/1000,d=+document.querySelector('#d').value/1000,a=+document.querySelector('#a').value*Math.PI/180,v=q/(Math.PI*d*d/4),m=998*q,fx=m*v*(Math.cos(a)-1),fy=m*v*Math.sin(a),fm=Math.hypot(fx,fy);qv.value=(q*1000).toFixed(1);dv.value=(d*1000).toFixed(0);av.value=(a*180/Math.PI).toFixed(0);document.querySelector('#fx').value=fx.toFixed(2);document.querySelector('#fy').value=fy.toFixed(2);document.querySelector('#fm').value=fm.toFixed(2);out.setAttribute('x2',420+120*Math.cos(a));out.setAttribute('y2',200-120*Math.sin(a));force.setAttribute('x2',300+fx*6);force.setAttribute('y2',230-fy*6)}['q','d','a'].forEach(x=>document.querySelector('#'+x).addEventListener('input',u));u();</script></html>
