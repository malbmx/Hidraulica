<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font-family:Arial,sans-serif;color:#173042;margin:0;padding:18px;background:#fff}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{width:100%;height:auto;border:1px solid #d9e2e8}output{font-weight:700;color:#0b4f6c}.note{font-size:.9rem;color:#5b6570}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><h1>Explorador de Bernoulli</h1><div class="grid"><div><label>Diferencia de elevación Δz (m) <input id="dz" type="range" min="0" max="8" step="0.1" value="4"> <output id="dzv"></output></label><label>Pérdida proporcionada hL (m) <input id="hl" type="range" min="0" max="3" step="0.1" value="0.8"> <output id="hlv"></output></label><label>Diámetro de salida (mm) <input id="d" type="range" min="20" max="100" value="40"> <output id="dv"></output></label><p>Velocidad = <output id="v"></output> m/s<br>Caudal = <output id="q"></output> L/s</p></div><svg viewBox="0 0 600 320" aria-label="Depósito elevado y salida"><rect x="40" y="45" width="220" height="190" fill="#ddf4fb" stroke="#2878b5" stroke-width="6"/><path d="M260 205 H510 V270" fill="none" stroke="#2878b5" stroke-width="28"/><line id="egl" x1="40" y1="70" x2="550" y2="190" stroke="#2f7d32" stroke-width="6"/><line id="hgl" x1="40" y1="115" x2="550" y2="235" stroke="#7b3fa1" stroke-width="6"/><text x="345" y="185">EGL</text><text x="345" y="235">HGL</text></svg></div><p class="note">Modelo didáctico entre una superficie libre y una salida atmosférica. La pérdida se proporciona, no se calcula.</p><script>function u(){let dz=+document.querySelector('#dz').value,hl=+document.querySelector('#hl').value,d=+document.querySelector('#d').value/1000,head=Math.max(0,dz-hl),v=Math.sqrt(2*9.81*head),q=v*Math.PI*d*d/4*1000;dzv.value=dz.toFixed(1);hlv.value=hl.toFixed(1);dv.value=(d*1000).toFixed(0);document.querySelector('#v').value=v.toFixed(2);document.querySelector('#q').value=q.toFixed(2);egl.setAttribute('y2',70+hl*30);hgl.setAttribute('y2',115+hl*30)}['dz','hl','d'].forEach(x=>document.querySelector('#'+x).addEventListener('input',u));u();</script></html>
